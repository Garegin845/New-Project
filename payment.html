<!DOCTYPE html>
<html lang="hy">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EcoFarm Connect — Payment</title>

    <link rel="stylesheet"
          href="./payment.css">

</head>

<body>

<div class="payment-page">

    <div class="payment-card">

        <div class="payment-top">

            <div class="payment-logo">
                🌱
            </div>

            <span class="secure">
                🔒 Secure Payment
            </span>

        </div>


        <div class="payment-title">

            <span class="step">
                STEP 2 OF 2
            </span>

            <h1>
                Ընտրեք վճարման եղանակը
            </h1>

            <p>
                Ավարտեք վճարումը՝ EcoFarm Connect-ը
                օգտագործելու համար։
            </p>

        </div>


        <div class="order-card">

            <div>

                <span>
                    Ընտրված պլան
                </span>

                <strong id="selected-plan">
                    Eco Start
                </strong>

            </div>


            <strong id="selected-price">
                $9 / ամիս
            </strong>

        </div>


        <div
            id="payment-status"
            class="payment-status">
        </div>


        <div class="payment-methods">


            <button
                class="payment-method"
                onclick="payWith('Google Pay')">

                <div class="method-icon google">
                    G
                </div>

                <div class="method-info">

                    <strong>
                        Google Pay
                    </strong>

                    <span>
                        Վճարել Google Pay-ով
                    </span>

                </div>

                <b>›</b>

            </button>


            <button
                class="payment-method"
                onclick="payWith('Apple Pay')">

                <div class="method-icon apple">
                    
                </div>

                <div class="method-info">

                    <strong>
                        Apple Pay
                    </strong>

                    <span>
                        Արագ և անվտանգ վճարում
                    </span>

                </div>

                <b>›</b>

            </button>


            <button
                class="payment-method"
                onclick="payWith('Visa')">

                <div class="method-icon visa">
                    VISA
                </div>

                <div class="method-info">

                    <strong>
                        Visa
                    </strong>

                    <span>
                        Վճարում քարտով
                    </span>

                </div>

                <b>›</b>

            </button>


            <button
                class="payment-method"
                onclick="payWith('Mastercard')">

                <div class="method-icon mastercard">
                    MC
                </div>

                <div class="method-info">

                    <strong>
                        Mastercard
                    </strong>

                    <span>
                        Վճարում Mastercard քարտով
                    </span>

                </div>

                <b>›</b>

            </button>


            <button
                class="payment-method"
                onclick="payWith('ArCa')">

                <div class="method-icon arca">
                    ArCa
                </div>

                <div class="method-info">

                    <strong>
                        ArCa
                    </strong>

                    <span>
                        Վճարում ArCa քարտով
                    </span>

                </div>

                <b>›</b>

            </button>

        </div>


        <div class="payment-security">

            🔐 Ձեր տվյալները պաշտպանված են

            <span>
                •
            </span>

            EcoFarm Connect Secure Checkout

        </div>


        <button
            class="back-btn"
            onclick="history.back()">

            ← Վերադառնալ

        </button>

    </div>

</div>


<script src="./payment.js"></script>

</body>
</html>
